[project]
name = "viberick-dub"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.30",
  "google-cloud-speech>=2.30",
  "google-cloud-storage>=2.18",
  "rapidfuzz>=3.9",
  "yt-dlp>=2025.9.1",
  "httpx>=0.27",
  "fastapi>=0.143.0",
  "uvicorn>=0.54.0",
  "google-cloud-firestore>=2.34.1",
  "google-cloud-run>=0.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
sep = ["demucs>=4.0.1", "torch>=2.4", "torchaudio>=2.4", "soundfile>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls Google APIs (costs money, needs credentials)"]
addopts = "-m 'not live'"

[tool.uv]
default-groups = ["dev", "sep"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
